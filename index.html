let mode = "practice";
let ex = null;
const SEC_ORDER = ["math", "kozo", "kumi", "eng", "kaki"];
const subCount = x => (x.q.match(/^問\d/gm) || []).length || 1;
let exOpts = Object.assign({ count: 20, secs: 60, mix: 70 }, store.get("spi-exam-opts", {}));
const MIXES = { 70: [0.7, 0.2, 0.1], 60: [0.6, 0.3, 0.1], 0: null };
function planCounts(p, n) {
  const mix = MIXES[exOpts.mix];
  const lvs = [1, 2, 3].filter(l => st.lvs.includes(l));
  if (!mix || !lvs.length) return null;
  const w = lvs.map(l => mix[l - 1]), ws = w.reduce((a, b) => a + b, 0);
  const raw = w.map(x => x / ws * n), tgt = raw.map(Math.floor);
  let rem = n - tgt.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - Math.floor(r), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rem > 0) { tgt[i]++; rem--; } });
  return lvs.map((l, i) => [l, tgt[i]]);
}
function pickExam() {
  const p = shuffled(pool()), n = Math.min(exOpts.count, p.length);
  const plan = planCounts(p, n);
  if (!plan) return p.slice(0, n);
  const used = new Set(); let out = [];
  plan.forEach(([l, k]) => { const c = p.filter(x => x.lv === l).slice(0, k); c.forEach(x => used.add(x)); out = out.concat(c); });
  if (out.length < n) out = out.concat(p.filter(x => !used.has(x)).slice(0, n - out.length));
  return out;
}

function pool() { return Q.filter(x => st.secs.includes(x.sec) && st.lvs.includes(x.lv)); }
function shuffled(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function norm(s) { return (s || "").normalize("NFKC").toLowerCase().replace(/[\s()、,。.:：・→]/g, ""); }
function nums(s) { return ((s || "").normalize("NFKC").replace(/問\d|[(]\d[)]/g, "").replace(/,/g, "").match(/\d+(?:\.\d+)?(?:\/\d+)?/g) || []); }
function guess(u, k) {
  if (!u || !u.trim()) return "bad";
  if (norm(u) === norm(k)) return "ok";
  const lm = k.normalize("NFKC").match(/^\(?([a-h])\)?(?:[\s(]|$)/i);
  if (lm && norm(u) === lm[1].toLowerCase()) return "ok";
  const a = nums(u), b = nums(k);
  if (b.length && a.length === b.length) return a.every((v, i) => v === b[i]) ? "ok" : "bad";
  return null;
}

function setMode(m) {
  if (ex && ex.handle) { clearInterval(ex.handle); ex.handle = null; }
  if (mode === "exam" && ex && !ex.done) ex = null;
  mode = m; stopTimer(); resetCard();
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.m === m));
  $("practiceTools").hidden = m !== "practice";
  document.querySelector("nav").hidden = m !== "practice";
  rebuild();
}

function renderExam() {
  const card = $("card"); card.innerHTML = "";
  $("filtersBox").hidden = !!(ex && !ex.done);
  if (!ex) return renderSetup(card);
  if (ex.done) return renderResults(card);
  renderExamQ(card);
}

function renderSetup(card) {
  const p = pool();
  $("score").textContent = "Kho đề: " + Q.length + " câu";
  const band = el("div", "band"); band.appendChild(el("span", "sec", "模擬試験")); band.appendChild(el("span", "meta", "Thi thử")); card.appendChild(band);
  const body = el("div", "body");
  body.appendChild(el("p", "note", "Đề rút ngẫu nhiên từ các phần và mức đang chọn ở trên, xếp theo thứ tự 非言語 → 構造的把握力 → 組問題 → 英語 như đề thật. Mỗi câu có giờ riêng, hết giờ tự sang câu sau và không quay lại được. 組問題 được nhân thời gian theo số câu hỏi con."));
  const setup = el("div", "setup");
  const mk = (id, label, opts, val, onch) => {
    const f = el("div", "field"); const l = el("label", null, label); l.htmlFor = id;
    const s = document.createElement("select"); s.id = id;
    opts.forEach(([v, t]) => { const o = document.createElement("option"); o.value = v; o.textContent = t; if (+v === val) o.selected = true; s.appendChild(o); });
    s.onchange = () => { onch(+s.value); store.set("spi-exam-opts", exOpts); render(); };
    f.appendChild(l); f.appendChild(s); return f;
  };
  setup.appendChild(mk("exCount", "Số câu", [[10, "10 câu"], [20, "20 câu"], [30, "30 câu"], [40, "40 câu"]], exOpts.count, v => exOpts.count = v));
  setup.appendChild(mk("exSecs", "Thời gian mỗi câu", [[45, "45 giây"], [60, "60 giây"], [90, "90 giây"]], exOpts.secs, v => exOpts.secs = v));
  setup.appendChild(mk("exMix", "Tỉ lệ dễ / TB / khó", [[70, "70 / 20 / 10"], [60, "60 / 30 / 10"], [0, "Theo tỉ lệ của kho"]], exOpts.mix, v => exOpts.mix = v));
  body.appendChild(setup);
  const n = Math.min(exOpts.count, p.length);
  const est = Math.round(shuffledEst(p, n) / 60);
  const byLv = [1, 2, 3].map(l => p.filter(x => x.lv === l).length);
  const plan = planCounts(p, n);
  const planTxt = plan ? " Dự kiến: " + plan.map(([l, k]) => k + " " + LVS[l].toLowerCase()).join(", ") + "." : "";
  body.appendChild(el("p", "note", p.length ? ("Có " + p.length + " câu phù hợp (" + byLv[0] + " cơ bản, " + byLv[1] + " trung bình, " + byLv[2] + " khó). Đề gồm " + n + " câu, khoảng " + est + " phút." + planTxt) : "Chưa có câu nào phù hợp. Chọn ít nhất một phần và một mức."));
  const btns = el("div", "btns");
  const go = el("button", "main", "Bắt đầu thi"); go.type = "button"; go.disabled = !p.length; go.onclick = startExam;
  btns.appendChild(go); body.appendChild(btns);
  card.appendChild(body);
}
function shuffledEst(p, n) { if (!p.length) return 0; const avg = p.reduce((s, x) => s + subCount(x), 0) / p.length; return avg * n * exOpts.secs; }

function startExam() {
  const pick = pickExam();
  pick.sort((a, b) => SEC_ORDER.indexOf(a.sec) - SEC_ORDER.indexOf(b.sec));
  ex = { items: pick, i: 0, ans: [], marks: [], done: false, left: 0, total: 0, handle: null };
  startQ();
}
function startQ() {
  const x = ex.items[ex.i];
  draft = ""; ex.total = ex.left = exOpts.secs * subCount(x);
  if (ex.handle) clearInterval(ex.handle);
  ex.handle = setInterval(() => {
    ex.left--;
    const t = $("exTimer"), b = $("exTimeBar");
    if (t) { t.textContent = ex.left + " giây"; t.classList.toggle("low", ex.left <= 10); }
    if (b) { b.firstChild.style.width = Math.max(0, ex.left / ex.total * 100) + "%"; b.classList.toggle("low", ex.left <= 10); }
    if (ex.left <= 0) nextQ();
  }, 1000);
  render();
}
function nextQ() {
  ex.ans[ex.i] = draft.trim();
  clearInterval(ex.handle); ex.handle = null;
  ex.i++;
  if (ex.i >= ex.items.length) { ex.done = true; ex.marks = ex.items.map((x, i) => guess(ex.ans[i], x.a)); render(); window.scrollTo(0, 0); }
  else startQ();
}

let confirmStop = false;
function renderExamQ(card) {
  const x = ex.items[ex.i], N = ex.items.length;
  $("score").textContent = "Câu " + (ex.i + 1) + " / " + N;
  const prog = el("div", "bar"); const pi = document.createElement("i"); pi.style.width = (ex.i / N * 100) + "%"; prog.appendChild(pi); card.appendChild(prog);
  const band = el("div", "band");
  band.appendChild(el("span", "sec", SECS[x.sec]));
  const t = el("span", "bigtimer" + (ex.left <= 10 ? " low" : ""), ex.left + " giây"); t.id = "exTimer"; band.appendChild(t);
  card.appendChild(band);
  const tb = el("div", "bar time" + (ex.left <= 10 ? " low" : "")); tb.id = "exTimeBar"; const ti = document.createElement("i"); ti.style.width = (ex.left / ex.total * 100) + "%"; tb.appendChild(ti); card.appendChild(tb);

  const body = el("div", "body");
  const isEn = x.sec === "eng" || x.sec === "kaki";
  body.appendChild(el("div", "q" + (isEn ? " en" : ""), x.q));
  const ans = el("div", "answer");
  const lab = el("label", null, "Câu trả lời"); lab.htmlFor = "exAns";
  const ta = document.createElement("textarea"); ta.id = "exAns"; ta.value = draft;
  ta.placeholder = subCount(x) > 1 ? "Ví dụ: 問1 60円 問2 400円" : "Gõ đáp án";
  ta.oninput = () => { draft = ta.value; };
  ta.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); nextQ(); } };
  ans.appendChild(lab); ans.appendChild(ta);
  const btns = el("div", "btns");
  const nx = el("button", "main", ex.i === N - 1 ? "Nộp bài" : "Câu tiếp"); nx.type = "button"; nx.onclick = nextQ;
  const stop = el("button", "sub", "Dừng thi"); stop.type = "button";
  stop.onclick = () => {
    if (!confirmStop) { confirmStop = true; stop.textContent = "Bấm lần nữa để dừng"; setTimeout(() => { confirmStop = false; if (stop.isConnected) stop.textContent = "Dừng thi"; }, 3000); return; }
    confirmStop = false; clearInterval(ex.handle); ex = null; render();
  };
  btns.appendChild(nx); btns.appendChild(stop); ans.appendChild(btns);
  ans.appendChild(el("div", "hint", "Enter để sang câu tiếp. Không quay lại được câu trước."));
  body.appendChild(ans);
  card.appendChild(body);
  ta.focus({ preventScroll: true });
}

function renderResults(card) {
  $("score").textContent = "Đã nộp bài";
  const band = el("div", "band"); band.appendChild(el("span", "sec", "Kết quả thi thử")); band.appendChild(el("span", "meta", ex.items.length + " câu")); card.appendChild(band);
  const body = el("div", "body");
  const sum = el("div", "sum"); sum.id = "exSum"; body.appendChild(sum);
  body.appendChild(el("p", "note", "Máy tự chấm những câu khớp rõ với đáp án và câu bỏ trống. Câu ghi \"Chưa chấm\" thì bạn so đáp án rồi bấm Đúng hoặc Sai."));
  const tw = el("div", "tbl-wrap"); tw.id = "exTbl"; body.appendChild(tw);

  const items = el("div", "items");
  ex.items.forEach((x, i) => {
    const it = el("div", "item");
    const head = el("div", "head");
    const hl = el("span"); hl.appendChild(el("b", null, (i + 1) + ". " + SECS[x.sec])); hl.appendChild(document.createTextNode(" · " + x.t + " · " + LVS[x.lv]));
    const state = el("span", "state"); state.id = "st" + i;
    head.appendChild(hl); head.appendChild(state); it.appendChild(head);
    const d = document.createElement("details"); d.appendChild(el("summary", null, "Xem đề"));
    d.appendChild(el("div", "q" + (x.sec === "eng" || x.sec === "kaki" ? " en" : ""), x.q)); it.appendChild(d);
    const yl = el("div", "line"); yl.appendChild(el("em", null, "Bạn: ")); yl.appendChild(document.createTextNode(ex.ans[i] || "(bỏ trống)")); it.appendChild(yl);
    const al = el("div", "line"); al.appendChild(el("em", null, "Đáp án: ")); const as = el("span", null, x.a); as.style.background = "var(--mark)"; as.style.padding = "1px 4px"; al.appendChild(as); it.appendChild(al);
    const exl = el("div", "line"); exl.appendChild(el("em", null, "Giải thích: ")); exl.appendChild(document.createTextNode(x.ex)); it.appendChild(exl);
    if (x.tip) { const tl = el("div", "line"); tl.appendChild(el("em", null, "Đoán nhanh: ")); tl.appendChild(document.createTextNode(x.tip)); it.appendChild(tl); }
    const sm = el("div", "selfmark");
    const ok = el("button", "sub ok", "Đúng"), bad = el("button", "sub bad", "Sai"); ok.type = bad.type = "button";
    ok.id = "ok" + i; bad.id = "bad" + i;
    ok.onclick = () => { ex.marks[i] = "ok"; refreshResults(); };
    bad.onclick = () => { ex.marks[i] = "bad"; refreshResults(); };
    sm.appendChild(ok); sm.appendChild(bad); it.appendChild(sm);
    items.appendChild(it);
  });
  body.appendChild(items);

  const btns = el("div", "btns");
  const save = el("button", "main", "Lưu kết quả vào phần luyện tập"); save.type = "button"; save.id = "exSave";
  save.onclick = () => {
    ex.items.forEach((x, i) => { if (ex.marks[i]) marks[x.id] = ex.marks[i]; });
    store.set("spi-marks", marks); save.textContent = "Đã lưu — dùng \"Chỉ câu đã sai\" để ôn lại"; save.disabled = true;
  };
  const again = el("button", "sub", "Thi đề mới"); again.type = "button"; again.onclick = () => { ex = null; render(); window.scrollTo(0, 0); };
  btns.appendChild(save); btns.appendChild(again);
  body.appendChild(btns);
  card.appendChild(body);
  refreshResults();
}

function refreshResults() {
  const N = ex.items.length;
  const ok = ex.marks.filter(m => m === "ok").length, bad = ex.marks.filter(m => m === "bad").length, none = N - ok - bad;
  const sum = $("exSum"); sum.innerHTML = "";
  const big = el("div", "big"); big.appendChild(document.createTextNode(ok)); big.appendChild(el("small", null, " / " + N + " đúng"));
  sum.appendChild(big);
  sum.appendChild(el("span", "note", "Sai " + bad + " · Chưa chấm " + none + (none ? "" : " · Tỉ lệ đúng " + Math.round(ok / N * 100) + "%")));
  const tw = $("exTbl"); tw.innerHTML = "";
  const tbl = el("table", "res"); const tr0 = document.createElement("tr");
  ["Phần", "Số câu", "Đúng", "Sai", "Chưa chấm"].forEach(h => tr0.appendChild(el("th", null, h))); tbl.appendChild(tr0);
  SEC_ORDER.forEach(s => {
    const idx = ex.items.map((x, i) => x.sec === s ? i : -1).filter(i => i >= 0);
    if (!idx.length) return;
    const o = idx.filter(i => ex.marks[i] === "ok").length, b = idx.filter(i => ex.marks[i] === "bad").length;
    const tr = document.createElement("tr");
    [SECS[s], idx.length, o, b, idx.length - o - b].forEach(v => tr.appendChild(el("td", null, String(v))));
    tbl.appendChild(tr);
  });
  tw.appendChild(tbl);
  ex.items.forEach((x, i) => {
    const m = ex.marks[i], s = $("st" + i);
    s.className = "state " + (m || "none"); s.textContent = m === "ok" ? "Đúng" : m === "bad" ? "Sai" : "Chưa chấm";
    $("ok" + i).setAttribute("aria-pressed", m === "ok"); $("bad" + i).setAttribute("aria-pressed", m === "bad");
  });
  const sv = $("exSave"); if (sv && sv.disabled) { sv.disabled = false; sv.textContent = "Lưu kết quả vào phần luyện tập"; }
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => { if (b.dataset.m !== mode) setMode(b.dataset.m); });

buildChips(); reshuffle(); rebuild();
</script>

  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
